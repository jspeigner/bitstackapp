# Cloudflare Worker for bitstack.app (nosflare fork)
# IMPORTANT: Keep this worker name matching the existing Cloudflare Worker
# if you are updating the live deployment (do not create a second worker).
name = "bitstackapp"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding
# IMPORTANT: Replace database_name and database_id with the EXISTING
# D1 database already bound to the live bitstack.app worker.
# Creating a new D1 database will start empty (paid pubkeys / events lost).
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "nostr-relay"
database_id = "REPLACE_WITH_EXISTING_D1_UUID"

# Cron trigger for 24hr database maintenance
[triggers]
crons = ["0 0 * * *"]

# CPU limits (lower to 10 if not on paid Workers plan)
[limits]
cpu_ms = 300000

# Enable logs (off by default, but can enable)
[observability.logs]
enabled = false

# Durable Object migration with SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]
