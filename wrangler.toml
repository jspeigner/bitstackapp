# Cloudflare Worker for bitstack.app (nosflare fork)
name = "bitstack-relay"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding — reuse the existing live database (do not recreate)
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "nostr-relay"
database_id = "3974828d-c71f-4ef4-ad22-185aecc63695"

# Cron trigger for 24hr database maintenance
[triggers]
crons = ["0 0 * * *"]

# CPU limits — match live bitstack-relay setting (30000 ms)
[limits]
cpu_ms = 30000

# Enable logs (match live worker)
[observability.logs]
enabled = true

# Durable Object migration with SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]
